<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script>
    // Android's landscape viewport is wide, but the APK must keep touch HUD.
    if (location.hostname === 'appassets.androidplatform.net') {
      document.documentElement.classList.add('tq-android-app');
    }
  </script>
  <meta name="theme-color" content="#081a33">
  <title>Tabuada Quest</title>
  <style>
    #tq-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 75%,#103d52 0%,#081e32 52%,#050f20 100%);color:#f3e4be;font-family:system-ui,-apple-system,sans-serif;transition:opacity .4s ease;pointer-events:auto}
    #tq-boot.tq-ready{opacity:0;pointer-events:none}
    #app{visibility:hidden}
    body.tq-game-ready #app{visibility:visible}
    .tq-boot-panel{text-align:center;padding:28px;max-width:340px;width:85%}
    .tq-boot-ship{font-size:58px;display:block;filter:drop-shadow(0 8px 10px #0008);animation:tq-float 2.2s ease-in-out infinite}
    .tq-boot-title{font-size:clamp(21px,5vw,30px);font-weight:850;letter-spacing:.09em;margin:20px 0 6px}
    .tq-boot-label{font-size:14px;color:#b2d5d9;margin:10px 0 18px}
    .tq-boot-track{height:7px;border-radius:30px;overflow:hidden;background:#29455a;border:1px solid #58788b}
    .tq-boot-bar{width:35%;height:100%;background:linear-gradient(90deg,#d1a94f,#f6da93,#d1a94f);border-radius:30px;animation:tq-loading 1.75s ease-in-out infinite}
    .tq-boot-help{font-size:13px;line-height:1.5;color:#f4d6a1;margin-top:18px}
    .tq-boot-help[hidden]{display:none}
    @keyframes tq-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
    @keyframes tq-loading{0%{transform:translateX(-105%)}100%{transform:translateX(390%)}}
    @media(prefers-reduced-motion:reduce){.tq-boot-ship,.tq-boot-bar{animation:none}.tq-boot-bar{width:70%}}
  </style>
</head>
<body>
  <main id="app" aria-label="Tabuada Quest"></main>
  <div id="tq-boot" role="status" aria-live="polite" aria-label="Carregando Tabuada Quest">
    <div class="tq-boot-panel">
      <span class="tq-boot-ship" aria-hidden="true">🏴‍☠️</span>
      <div class="tq-boot-title">TABUADA QUEST</div>
      <p id="tq-boot-label" class="tq-boot-label">Preparando sua aventura pirata...</p>
      <div class="tq-boot-track"><div class="tq-boot-bar"></div></div>
      <p id="tq-boot-help" class="tq-boot-help" hidden></p>
    </div>
  </div>
  <script>
    // Single volatile cache version for every JS module, stylesheet and asset.
    // Do not use this timestamp for player saves or gameplay persistence.
    const boot = document.getElementById('tq-boot');
    const bootLabel = document.getElementById('tq-boot-label');
    const bootHelp = document.getElementById('tq-boot-help');
    const app = document.getElementById('app');
    let bootFinished = false;
    const dismissBoot = () => {
      if (bootFinished) return;
      bootFinished = true;
      observer.disconnect();
      document.body.classList.add('tq-game-ready');
      boot.classList.add('tq-ready');
      boot.addEventListener('transitionend', () => boot.remove(), {once:true});
      setTimeout(() => boot.remove(), 800);
    };
    // The world signals readiness only after the first actual ocean render.
    window.addEventListener('tq:world-first-frame', () => {
      requestAnimationFrame(() => requestAnimationFrame(dismissBoot));
    });
    const checkBoot = () => {
      if (app.querySelector('.portal-card, .portal-stage')) dismissBoot();
    };
    const observer = new MutationObserver(checkBoot);
    observer.observe(app, {childList:true,subtree:true});
    setTimeout(() => {
      if (!bootFinished) {
        bootLabel.textContent = 'O mar está demorando a carregar...';
        bootHelp.hidden = false;
        bootHelp.textContent = 'Ainda estamos preparando o jogo. Se demorar demais, atualize a página.';
      }
    }, 12000);
    (async () => {
      // Development mode: force fresh modules, styles and assets on every launch.
      const version = String(Date.now());
      window.__TQ_ASSET_VERSION__ = version;
      // Mapped paths cover the complete module graph, including future-region ships.
      // Keep this list in sync with src/**/*.js and src/**/*.mjs; regression test enforces it.
      const modulePaths = ["src/auth/AuthService.js","src/auth/firebase.js","src/combat/HarpoonCatalog.js","src/combat/HullRepair.js","src/combat/NavalBattleController.js","src/combat/NavalBattleRules.js","src/combat/NavalCombatRules.mjs","src/combat/NpcAmmoLoot.js","src/combat/SeekingOrbSlow.js","src/combat/fx/AmmoFxProfile.mjs","src/config/firebase-config.example.js","src/core/GameLoop.js","src/core/GameState.js","src/education/LearningProgress.js","src/education/RegionMastery.js","src/education/pedagogy-curriculum.json","src/events/HalloweenAtmosphere.js","src/events/HalloweenSeaGlints.js","src/gameplay/PedagogicalActions.js","src/items/CannonLoadout.js","src/items/EquipmentCatalog.js","src/main.js","src/missions/CampaignEngine.js","src/missions/CampaignState.js","src/missions/FleetCampaign.js","src/missions/MissionFlow.js","src/missions/R3SilasTrade.js","src/missions/RegionFourCampaign.js","src/missions/RegionOneCampaign.js","src/missions/RegionThreeCampaign.js","src/missions/RegionTwoCampaign.js","src/monsters/LeviathanMouthMap.js","src/monsters/MonsterBloodRenderer.js","src/monsters/MonsterCombat.js","src/monsters/MonsterPopulation.js","src/monsters/MonsterPresenceWebGLRenderer.mjs","src/npcs/BloodRedCorsairNpc.js","src/npcs/CorsairPopulation.js","src/npcs/DarkWatersFleet.js","src/npcs/FleetPopulation.js","src/npcs/FrozenMirrorBoss.js","src/npcs/FugitiveFrigateNpc.js","src/npcs/NpcSelection.js","src/npcs/RedSailCorsair.js","src/npcs/RoseGoldCorsair.js","src/npcs/TerrorDoMarNpc.js","src/persistence/LocalSaveStore.js","src/persistence/SyncPreference.js","src/rendering/CloudLayerRenderer.js","src/rendering/DamageTextRenderer.js","src/rendering/DarkWatersPortal.js","src/rendering/FreezeEffects.js","src/rendering/HalloweenFogRenderer.js","src/rendering/IslandRenderer.js","src/rendering/LegacyOceanWebGLRenderer.mjs","src/rendering/NavalCombatWebGLRenderer.mjs","src/rendering/NpcRenderer.js","src/rendering/OceanRenderer.js","src/rendering/OrbitalCameraProjection.js","src/rendering/PlayerWakeTrail.js","src/rendering/ShipRenderer.js","src/rendering/SpectralShipWebGLRenderer.js","src/rendering/TreasureGlowWebGLRenderer.js","src/rendering/TreasureRenderer.js","src/rendering/shaders/halloweenFog.js","src/ships/BlackMarketCorsairMapping.js","src/ships/BlackMarketShip.js","src/ships/BlackVeilCorsairShip.js","src/ships/BloodRedCorsairShip.js","src/ships/CannonMuzzleMap.js","src/ships/CrimsonSkullGalleonShip.js","src/ships/EclipseShip.js","src/ships/EmeraldGhostShip.js","src/ships/FleetAutoEquipment.js","src/ships/FrozenLandsGalleonShip.js","src/ships/FugitiveFrigateShip.js","src/ships/GoldenGalleonShip.js","src/ships/HalloweenTabuadaShip.js","src/ships/ImperialBlackGalleonShip.js","src/ships/NorthernThiefShip.js","src/ships/PumpkinFleetGalleonShip.js","src/ships/RoseGoldShip.js","src/ships/ShadowChaserShip.js","src/ships/ShipRegistry.js","src/ships/ShipSpeed.js","src/ships/ShipSpriteLoader.js","src/ships/StarterShip.js","src/ships/TerrorDoMarShip.js","src/treasures/RegionTreasures.js","src/ui/AnalogJoystick.js","src/ui/FirstVoyageGuide.js","src/ui/GuidedPointer.js","src/ui/IslandPanel.js","src/ui/KeyboardCameraInput.js","src/ui/LayoutMode.js","src/ui/MathGate.js","src/ui/Minimap.js","src/ui/MissionBoard.js","src/ui/MissionHud.js","src/ui/NavalCombatHud.js","src/ui/Portal.js","src/ui/Shipyard.js","src/world/BattleCamera.js","src/world/CameraSystem.js","src/world/ClickNavigationInput.js","src/world/IslandCollision.js","src/world/NavigationSystem.js","src/world/WorldCollision.mjs","src/world/WorldNavigationInput.mjs","src/world/WorldOceanEffect.mjs","src/world/WorldState.js","src/world/navigation/PlayerKinematics.mjs","src/world/regions/FutureFleetRegions.js","src/world/regions/r1.js","src/world/regions/r2.js","src/world/regions/r3.js","src/world/regions/r4.js"];
      const imports = {};
      for (const path of modulePaths) {
        const absolute = new URL('./' + path, document.baseURI).href;
        imports[absolute] = absolute + '?v=' + version;
      }
      const importMap = document.createElement('script');
      importMap.type = 'importmap';
      importMap.textContent = JSON.stringify({ imports });
      document.head.append(importMap);

      // Start downloading the module graph while CSS is fetched and processed.
      // The import map above must exist before modulepreload is registered.
      const mainUrl = new URL('./src/main.js', document.baseURI).href;
      const modulePreload = document.createElement('link');
      modulePreload.rel = 'modulepreload';
      modulePreload.href = imports[mainUrl];
      document.head.append(modulePreload);
      // Rewrite CSS url(...) assets too, so background images cannot stay stale.
      const cssUrl = new URL('./src/ui/app.css', document.baseURI);
      bootLabel.textContent = 'Carregando visual e embarcações...';
      const response = await fetch(cssUrl.href + '?v=' + version, { cache: 'no-store' });
      if (!response.ok) throw new Error('CSS HTTP ' + response.status);
      const css = (await response.text()).replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, (_, quote, raw) => {
        const asset = new URL(raw, cssUrl);
        asset.searchParams.set('v', version);
        return 'url("' + asset.href + '")';
      });
      const style = document.createElement('style');
      style.textContent = css;
      document.head.append(style);
      bootLabel.textContent = 'Iniciando o oceano...';
      // Do not retry the entry module under a different URL: a missing dependency
      // or a syntax error would be reported as a misleading main.js fetch failure.
      try {
        await import(imports[mainUrl]);
      } catch (error) {
        console.error('Falha na importação inicial do TQ (verifique também as requisições de módulos no Network):', error);
        throw new Error('Falha ao carregar os módulos do jogo. Verifique se o servidor LAN está servindo os arquivos atualizados. Detalhe: ' + (error?.message || String(error)));
      }
    })().catch(error => {
      console.error('Falha ao carregar Tabuada Quest', error);
      observer.disconnect();
      bootLabel.textContent = 'Não foi possível iniciar o jogo';
      bootHelp.hidden = false;
      bootHelp.textContent = (error?.message || String(error)) + '. Atualize a página para tentar novamente.';
    });
  </script>
</body>
</html>
