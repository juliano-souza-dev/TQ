name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Landscape immersive APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEYSTORE: ${{ secrets.TQ_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout game and assets
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already provides the Android SDK.
      # setup-android@v3 currently tries to install the removed 'tools'
      # package and fails before Gradle starts.
      - name: Install Android 35 platform and build tools
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?\"ANDROID_HOME must be set on the runner\"}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found in $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 3 -type d | head -80
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate game JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run game and camera smoke tests
        run: |
          node --check src/main.js
          node --test tests/orbital-camera-projection.test.mjs tests/android-packaging.test.mjs

      # Retain the debug signing identity across CI runs, so Android upgrades
      # can keep localStorage saves. Production releases still use private secrets.
      - name: Reuse test APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tq-android-debug-keystore-v1

      - name: Build installable debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verify game files actually shipped inside APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" | grep -Fx 'assets/www/index.html' > /dev/null
          unzip -Z1 "$APK" | grep -Fx 'assets/www/src/main.js' > /dev/null
          unzip -Z1 "$APK" | grep -Fx 'assets/www/assets/globals/ocean-tile-tabuada-region01.webp' > /dev/null

      - name: Verify debug APK certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TabuadaQuest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode optional private release signing key
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        run: printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tq-release.jks"

      - name: Build signed upgradeable release APK
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        env:
          TQ_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/tq-release.jks
          TQ_ANDROID_STORE_PASSWORD: ${{ secrets.TQ_ANDROID_STORE_PASSWORD }}
          TQ_ANDROID_KEY_ALIAS: ${{ secrets.TQ_ANDROID_KEY_ALIAS }}
          TQ_ANDROID_KEY_PASSWORD: ${{ secrets.TQ_ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Publish signed Android release APK
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TabuadaQuest-Android-Release-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60
