name: Rebuild Imperial Galleon alpha atlas
on:
  push:
    paths:
      - '.github/workflows/build-imperial-alpha.yml'
      - 'scripts/imperial_alpha_atlas.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transparent-asset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image conversion dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Remove navy background from 16 ship headings
        run: python scripts/imperial_alpha_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: galeao-negro-imperial-transparente
          path: assets/ships/galeao-negro-imperial-transparente.webp
      - name: Save transparent WebP to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ships/galeao-negro-imperial-transparente.webp
          if git diff --staged --quiet; then
            echo "Transparent atlas is already current"
          else
            git commit -m "assets: add genuine transparent Imperial Galleon 16-frame WebP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
